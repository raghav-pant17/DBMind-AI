[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbmind-ai"
version = "0.1.0"
description = "Self-correcting multi-agent enterprise data intelligence system."
readme = "Readme.md"
requires-python = ">=3.11"
authors = [{ name = "DBMind-AI Team" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "typer>=0.12",
    "rich>=13.7",
    "langchain>=1.2",
    "langchain-community>=0.4",
    "langgraph>=1.2",
    "langchain-text-splitters>=1.0",
    "langchain-openai>=1.0",
    "langchain-google-genai>=3.0",
    "chromadb>=0.5",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
dbmind-ai = "dbmind_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
